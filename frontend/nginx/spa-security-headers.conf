include /etc/nginx/snippets/security-headers.conf;
# Listing photos are hot-linked from the listing sites. The service worker is also bound by
# connect-src, so it must not fetch()/cache those images unless the hosts are added there.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://img.nepremicnine.net https://img.onnepremicnine.net; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
