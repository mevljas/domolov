name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mevljas/domolov

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Domolov.slnx
      - name: Format check (csharpier)
        run: |
          dotnet tool install -g csharpier --version 1.0.2
          csharpier check .
        continue-on-error: true
      - name: Build
        run: dotnet build Domolov.slnx -c Release --no-restore
      - name: Test with coverage
        run: >
          dotnet test Domolov.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
      - name: Coverage gate (Domain + Application)
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, sys
          files = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          if not files:
              print("No coverage files"); sys.exit(1)
          lines_valid = lines_covered = 0
          for f in files:
              root = ET.parse(f).getroot()
              for pkg in root.findall(".//package"):
                  name = pkg.attrib.get("name","")
                  if "Domolov.Domain" in name or "Domolov.Application" in name:
                      for cls in pkg.findall(".//class"):
                          for line in cls.findall(".//line"):
                              lines_valid += 1
                              if int(line.attrib.get("hits","0")) > 0:
                                  lines_covered += 1
          if lines_valid == 0:
              print("No domain/application lines found; skipping numeric gate")
              sys.exit(0)
          pct = 100.0 * lines_covered / lines_valid
          print(f"Domain+Application line coverage: {pct:.1f}% ({lines_covered}/{lines_valid})")
          if pct < 80:
              sys.exit(1)
          PY

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
