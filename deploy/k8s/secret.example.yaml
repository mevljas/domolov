# Template only: NOT part of kustomization.yaml. Copy it outside the repo, fill it in, and
#   kubectl apply -n domolov -f domolov-secrets.yaml
# or create the same Secret imperatively (see README.md). Delete keys you do not use.
apiVersion: v1
kind: Secret
metadata:
  name: domolov-secrets
  namespace: domolov
type: Opaque
stringData:
  ConnectionStrings__Default: Host=postgres.example.internal;Port=5432;Database=domolov;Username=domolov;Password=CHANGE_ME
  # One of the two. Hash: docker run --rm ghcr.io/mevljas/domolov-api hash-password '<password>'
  DOMOLOV_ADMIN_PASSWORD_HASH: ""
  DOMOLOV_ADMIN_PASSWORD: ""
  DOMOLOV_TELEGRAM_BOT_TOKEN: ""
  DOMOLOV_SMTP_HOST: ""
  DOMOLOV_SMTP_PORT: "587"
  DOMOLOV_SMTP_USER: ""
  DOMOLOV_SMTP_PASSWORD: ""
  DOMOLOV_SMTP_FROM: ""
  DOMOLOV_VAPID_PUBLIC_KEY: ""
  DOMOLOV_VAPID_PRIVATE_KEY: ""
  DOMOLOV_VAPID_SUBJECT: ""
