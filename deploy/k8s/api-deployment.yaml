apiVersion: apps/v1
kind: Deployment
metadata:
  name: domolov-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: domolov
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domolov
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      # EF Core takes a database migration lock, so replicas racing here is safe.
      initContainers:
        - name: migrate
          image: ghcr.io/mevljas/domolov-api:latest
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: domolov-config
            - secretRef:
                name: domolov-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: api
          image: ghcr.io/mevljas/domolov-api:latest
          env:
            - name: DOMOLOV_ROLE
              value: api
          envFrom:
            - configMapRef:
                name: domolov-config
            - secretRef:
                name: domolov-secrets
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
