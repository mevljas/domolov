apiVersion: apps/v1
kind: Deployment
metadata:
  name: domolov-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: domolov
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domolov
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        # The nginx user of nginxinc/nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/mevljas/domolov-web:latest
          env:
            # The ingress sends /api and /health straight to the api Service; this covers
            # clients that reach the web Service directly.
            - name: DOMOLOV_API_UPSTREAM
              value: http://domolov-api
          ports:
            - name: http
              containerPort: 8080
          # The entrypoint renders the nginx config into /etc/nginx/conf.d at startup.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 20
